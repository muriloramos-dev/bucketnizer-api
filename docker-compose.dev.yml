name: bucketnizer-dev

services:
    api:
        container_name: bucketnizer-api
        build:
            context: .
            dockerfile: Dockerfile.dev
        ports:
            - '3000:3000'
        volumes:
            - .:/app
            - /app/node_modules
        env_file:
            - .env
        environment:
            NODE_ENV: development
        command: pnpm run start:dev
        depends_on:
            mongodb:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - bucketnizer

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: bucketnizer-rabbitmq
        restart: unless-stopped
        ports:
            - '127.0.0.1:5673:5672'
            - '127.0.0.1:15673:15672'
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bucketnizer}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bucketnizer_dev}
            RABBITMQ_DEFAULT_VHOST: bucketnizer
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        networks:
            - bucketnizer

    mongodb:
        image: mongo:8
        container_name: bucketnizer-mongodb
        restart: unless-stopped
        ports:
            - '127.0.0.1:27018:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bucketnizer}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-bucketnizer_dev}
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    mongosh --quiet
                    --username "$$MONGO_INITDB_ROOT_USERNAME"
                    --password "$$MONGO_INITDB_ROOT_PASSWORD"
                    --authenticationDatabase admin
                    --eval "db.adminCommand('ping').ok"
                    | grep 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - bucketnizer

    redis:
        image: redis:7-alpine
        container_name: bucketnizer-redis
        restart: unless-stopped
        ports:
            - '127.0.0.1:6379:6379'
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-bucketnizer_dev}
        command:
            - /bin/sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                - CMD-SHELL
                - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - bucketnizer

    localstack:
        image: localstack/localstack:latest
        container_name: bucketnizer-localstack
        restart: unless-stopped
        ports:
            - '127.0.0.1:4566:4566'
        environment:
            AWS_DEFAULT_REGION: us-east-1
            PERSISTENCE: '1'
            DEBUG: '0'
            LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
        volumes:
            - localstack_data:/var/lib/localstack
            - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
        healthcheck:
            test:
                - CMD-SHELL
                - curl -fsS http://localhost:4566/_localstack/health >/dev/null
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - bucketnizer

networks:
    bucketnizer:
        driver: bridge

volumes:
    rabbitmq_data:
    mongodb_data:
    redis_data:
    localstack_data:
